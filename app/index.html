<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="viewport-fit: cover" />

    <title>{{{PRODUCT_NAME}}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>

  <body>
    <div id="main-container">
      <div id="main-loading-bar">
        <div class="Logo">
            <img src="./TemplateData/Logo_Text.png">
        </div>
        <div id="main-progress-bar-empty">
          <div id="main-progress-bar-full">
          </div>
        </div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#main-container");
      var loadingBar = document.querySelector("#main-loading-bar");
      var progressBarFull = document.querySelector("#main-progress-bar-full");
      var buildUrl = "Build/";
      var loaderUrl = buildUrl + "{{{LOADER_FILENAME}}}";
      var config = {
        dataUrl: buildUrl + "{{{DATA_FILENAME}}}",
        frameworkUrl: buildUrl + "{{{FRAMEWORK_FILENAME}}}",
        codeUrl: buildUrl + "{{{CODE_FILENAME}}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{COMPANY_NAME}}}",
        productName: "{{{PRODUCT_NAME}}}",
        productVersion: "{{{PRODUCT_VERSION}}}"
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((mainInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
