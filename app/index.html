<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="viewport-fit: cover" />

    <title>Lead On Life</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>

  <body>
    <div id="main-container">
      <canvas id="main-canvas"></canvas>
      <div id="main-loading-bar">
        <div class="Logo">
            <img src="./TemplateData/Logo_Text.png" alt="Lead On Life Logo">
        </div>
        <div id="main-progress-bar-empty">
          <div id="main-progress-bar-full">
          </div>
        </div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#main-canvas");
      var loadingBar = document.querySelector("#main-loading-bar");
      var progressBarFull = document.querySelector("#main-progress-bar-full");
      var buildUrl = "Build/";
      var loaderUrl = buildUrl + "c084286ab3748c2ebf70bd9dcb31f7d8.loader.js";
      var config = {
        dataUrl: buildUrl + "0af572c7ad147864477025957ce13141.data",
        frameworkUrl: buildUrl + "c4c6a42ec6737fb9fc0179c061c375e0.framework.js",
        codeUrl: buildUrl + "1d503f9652585509ecae5e95842a5ea7.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Samuel Savaria",
        productName: "Lead On Life",
        productVersion: "1.9"
      };
      
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      canvas.style.display = "none";
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          canvas.style.display = "block";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
